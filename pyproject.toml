[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockfish-vision-chess-ai"
version = "1.0.0"
description = "Bildschirm-Schachbrett-Erkennung und Stockfish-Analyse für Trainingsstellungen und abgeschlossene Partien."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Robinio" }]
dependencies = [
  "opencv-python>=4.9.0,<5",
  "python-chess>=1.10.0",
  "numpy>=1.26.0",
  "PySide6>=6.6.0",
  "mss>=9.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
packaging = ["pyinstaller>=6.0.0"]

[project.scripts]
stockfish-vision = "stockfish_vision.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockfish_vision = ["assets/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
